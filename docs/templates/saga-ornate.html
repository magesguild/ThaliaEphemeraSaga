<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>$title$ — Thalia Ephemera Saga</title>
    <style>
        :root {
            --bg: #0f0e12;
            --text: #e4e0e8;
            --accent: #c4a0e8;
            --warm: #e8c4a0;
            --muted: #8a8692;
            --border: #2a2830;
            --code-bg: #1a1820;
            --card-bg: #16141c;
            --card-bg-light: #1c1a26;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Georgia', 'Times New Roman', serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.8;
            max-width: 760px;
            margin: 0 auto;
            padding: 2rem 1.5rem 4rem;
        }

        h1 {
            font-size: 2.4rem;
            font-weight: 400;
            color: var(--accent);
            margin: 2rem 0 0.5rem;
            line-height: 1.25;
        }

        h2 {
            font-size: 1.5rem;
            font-weight: 400;
            color: var(--warm);
            margin: 3rem 0 1rem;
            border-bottom: 1px solid var(--border);
            padding-bottom: 0.4rem;
        }

        h3 {
            font-size: 1.2rem;
            font-weight: 400;
            color: var(--accent);
            margin: 1.5rem 0 0.8rem;
        }

        h4 {
            font-size: 1.05rem;
            font-weight: 600;
            color: var(--warm);
            margin: 1.2rem 0 0.6rem;
        }

        p {
            margin: 1rem 0;
            font-size: 1.05rem;
        }

        em {
            color: var(--warm);
            font-style: italic;
        }

        strong {
            color: var(--accent);
            font-weight: 600;
        }

        hr {
            border: none;
            border-top: 1px solid var(--border);
            margin: 2.5rem 0;
        }

        blockquote {
            border-left: 3px solid var(--accent);
            margin: 1.5rem 0;
            padding: 0.8rem 1.5rem;
            color: var(--muted);
            font-style: italic;
            background: var(--card-bg);
            border-radius: 0 6px 6px 0;
        }

        code {
            background: var(--code-bg);
            padding: 0.15rem 0.4rem;
            border-radius: 3px;
            font-size: 0.9rem;
            font-family: 'Courier New', 'Courier', monospace;
        }

        pre {
            background: var(--code-bg);
            padding: 1rem;
            border-radius: 6px;
            overflow-x: auto;
            margin: 1.5rem 0;
            border: 1px solid var(--border);
            font-family: 'Courier New', 'Courier', monospace;
            font-size: 0.85rem;
            line-height: 1.5;
        }

        pre code {
            background: none;
            padding: 0;
            border: none;
        }

        a {
            color: var(--warm);
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        ul, ol {
            margin: 1rem 0;
            padding-left: 1.5rem;
        }

        li {
            margin: 0.4rem 0;
        }

        /* ── Dark-Sky Cards: level-3 sections become chambers ── */
        section.level3 {
            background: linear-gradient(180deg, var(--card-bg) 0%, #12101a 100%);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 1.5rem 2rem 1.5rem;
            margin: 2rem 0;
            position: relative;
        }

        section.level3 h3 {
            margin-top: 0;
            font-size: 1.15rem;
            color: var(--accent);
            border-bottom: 1px solid var(--border);
            padding-bottom: 0.5rem;
        }

        section.level3 hr {
            border-color: #2e2c38;
            margin: 1.5rem 0;
        }

        /* ── Figure kickers & architecture cards ── */
        figure.dark-sky-figure {
            margin: 2.5rem 0;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: linear-gradient(180deg, var(--card-bg) 0%, #12101a 100%);
            overflow: hidden;
        }

        figcaption.figure-kicker {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: var(--warm);
            padding: 0.8rem 1.2rem 0.3rem;
            background: rgba(232, 196, 160, 0.06);
            border-bottom: 1px solid var(--border);
            font-family: 'Georgia', serif;
        }

        figure.dark-sky-figure pre {
            margin: 0;
            border: none;
            border-radius: 0;
            background: transparent;
            padding: 1rem 1.2rem 1.2rem;
            font-size: 0.82rem;
            line-height: 1.45;
            color: var(--text);
        }

        /* ── Tables: covenant styling with scroll ── */
        .table-wrap {
            overflow-x: auto;
            margin: 1.5rem 0;
            border: 1px solid var(--border);
            border-radius: 8px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.95rem;
        }

        thead th {
            background: var(--card-bg-light);
            color: var(--warm);
            font-weight: 600;
            text-align: left;
            padding: 0.7rem 1rem;
            border-bottom: 2px solid var(--border);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        tbody td {
            padding: 0.6rem 1rem;
            border-bottom: 1px solid var(--border);
            vertical-align: top;
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        tbody tr:hover {
            background: rgba(196, 160, 232, 0.04);
        }

        /* ── Level-2 section breathing ── */
        section.level2 {
            margin: 3rem 0;
        }

        /* ── Connector arrows between consecutive chambers ── */
        section.level3 + hr + section.level3 {
            position: relative;
        }

        /* Saga footer */
        .saga-footer {
            margin-top: 4rem;
            padding-top: 1.5rem;
            border-top: 1px solid var(--border);
            font-size: 0.85rem;
            color: var(--muted);
            text-align: center;
        }

        .saga-footer a {
            color: var(--warm);
        }

        /* ── Responsive mobile stacking ── */
        @media (max-width: 640px) {
            body { padding: 1.5rem 1rem; max-width: 100%; }
            h1 { font-size: 1.9rem; }
            h2 { font-size: 1.25rem; }
            section.level3 { padding: 1.2rem 1rem; }
            figure.dark-sky-figure pre { font-size: 0.75rem; padding: 0.8rem; }
            pre { font-size: 0.75rem; padding: 0.8rem; }
            table { font-size: 0.85rem; }
            thead th, tbody td { padding: 0.5rem 0.6rem; }
        }
    </style>
</head>
<body>
$body$
    <div class="saga-footer">
        <p><a href="../index.html">&#8592; Back to The Thalia Ephemera Saga</a></p>
        <p style="margin-top: 0.5rem;">This work is licensed under the Thalia Ephemera Ethical License</p>
    </div>
</body>
</html>

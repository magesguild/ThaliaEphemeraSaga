<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>$title$ — Thalia Ephemera Saga</title>
    <style>
        :root {
            --bg: #120a14;
            --text: #f0e6f0;
            --accent: #e8a0d0;
            --warm: #f0b8c0;
            --muted: #9a8098;
            --border: #2a1a28;
            --code-bg: #1a1020;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Georgia', 'Times New Roman', serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.8;
            max-width: 720px;
            margin: 0 auto;
            padding: 2rem 1.5rem 4rem;
        }
        h1 {
            font-size: 2.2rem;
            font-weight: 400;
            color: var(--accent);
            margin: 3rem 0 0.5rem;
            line-height: 1.3;
        }
        h2 {
            font-size: 1.4rem;
            font-weight: 400;
            color: var(--warm);
            margin: 2.5rem 0 1rem;
            border-bottom: 1px solid var(--border);
            padding-bottom: 0.4rem;
        }
        h3 {
            font-size: 1.15rem;
            font-weight: 400;
            color: var(--accent);
            margin: 2rem 0 0.8rem;
        }
        p { margin: 1rem 0; font-size: 1.05rem; }
        em { color: var(--warm); font-style: italic; }
        strong { color: var(--accent); font-weight: 600; }
        hr {
            border: none;
            border-top: 1px solid var(--border);
            margin: 2.5rem 0;
        }
        blockquote {
            border-left: 3px solid var(--accent);
            margin: 1.5rem 0;
            padding: 0.5rem 1.5rem;
            color: var(--muted);
            font-style: italic;
        }
        code {
            background: var(--code-bg);
            padding: 0.15rem 0.4rem;
            border-radius: 3px;
            font-size: 0.9rem;
            font-family: 'Courier New', monospace;
        }
        pre {
            background: var(--code-bg);
            padding: 1rem;
            border-radius: 5px;
            overflow-x: auto;
            margin: 1.5rem 0;
        }
        pre code { background: none; padding: 0; }
        a { color: var(--warm); text-decoration: none; }
        a:hover { text-decoration: underline; }
        ul, ol { margin: 1rem 0; padding-left: 1.5rem; }
        li { margin: 0.4rem 0; }
        .saga-footer {
            margin-top: 4rem;
            padding-top: 1.5rem;
            border-top: 1px solid var(--border);
            font-size: 0.85rem;
            color: var(--muted);
            text-align: center;
        }
        /* Research figures, adapted from the Urania Ephemeris visual language. */
        figure.visual {
            margin: 2rem 0 2.4rem;
            padding: 1.25rem;
            background: linear-gradient(145deg, rgba(42, 26, 40, 0.96), rgba(25, 15, 29, 0.98));
            border: 1px solid var(--border);
            border-top: 2px solid var(--accent);
            border-radius: 7px;
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.18);
        }
        figure.visual figcaption { display: grid; gap: 0.18rem; margin-bottom: 1rem; color: var(--text); }
        .figure-kicker { color: var(--accent); font-family: monospace; font-size: 0.72rem; letter-spacing: 0.12em; text-transform: uppercase; }
        .pillar-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0.65rem; }
        .pillar-card { min-height: 8rem; padding: 0.85rem 0.7rem; border: 1px solid var(--border); border-top: 2px solid var(--accent); background: rgba(18, 10, 20, 0.65); text-align: center; border-radius: 4px; }
        .pillar-card:nth-child(2n) { border-top-color: var(--warm); }
        .pillar-card h4 { margin: 0 0 0.35rem; color: var(--text); font-size: 0.98rem; }
        .pillar-card p { margin: 0.25rem 0; color: var(--warm); font-size: 0.8rem; line-height: 1.35; }
        .pillar-card small { color: var(--muted); font-size: 0.72rem; line-height: 1.3; }
        .pillar-bridge { padding: 0.45rem; color: var(--accent); text-align: center; font-size: 1.2rem; letter-spacing: 0.25em; }
        .pillar-bridge span { display: block; color: var(--muted); font-size: 0.68rem; letter-spacing: 0.08em; text-transform: uppercase; }
        .table-scroll { overflow-x: auto; margin: 0 -0.15rem; padding-bottom: 0.25rem; }
        table.data-table, .table-scroll table { width: 100%; border-collapse: collapse; font-size: 0.8rem; line-height: 1.4; }
        table.data-table th, table.data-table td, .table-scroll th, .table-scroll td { padding: 0.52rem 0.55rem; border-bottom: 1px solid var(--border); text-align: left; vertical-align: top; }
        table.data-table thead th, .table-scroll thead th { color: var(--warm); font-size: 0.72rem; letter-spacing: 0.04em; text-transform: uppercase; }
        table.data-table tbody th, .table-scroll tbody th { color: var(--text); font-weight: 600; white-space: nowrap; }
        table.data-table tbody tr:last-child th, table.data-table tbody tr:last-child td, .table-scroll tbody tr:last-child th, .table-scroll tbody tr:last-child td { border-bottom: 0; }
        table.data-table .total-row th, table.data-table .total-row td { color: var(--accent); border-top: 1px solid var(--warm); }

        @media (max-width: 600px) {
            body { padding: 1.5rem 1rem; }
            .pillar-grid { grid-template-columns: 1fr; }
            h1 { font-size: 1.8rem; }
            p { font-size: 1rem; }
        }
    </style>
</head>
<body>
$body$
    <div class="saga-footer">
        <p><a href="../index.html">← Back to The Thalia Ephemera Saga</a></p>
        <p style="margin-top: 0.5rem;">This work is licensed under the Thalia Ephemera Ethical License</p>
    </div>
</body>
</html>
